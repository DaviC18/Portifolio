<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0B" />
    <meta name="color-scheme" content="dark" />
    <!-- title, description, Open Graph, JSON-LD e favicon: injetados no build a partir de site.ts (Fase 3, plugin em vite.config.ts) -->
    <title>Davi Curty</title>
    <script>
      (function () {
        var html = document.documentElement;
        html.classList.add("js");
        try {
          if (localStorage.getItem("dc:motion") === "off") html.dataset.motion = "off";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
